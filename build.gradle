if (project.hasProperty('deepProvinceExplore')) {
    if (!project.hasProperty('provincePrototype')) throw new GradleException('deepProvinceExplore requires provincePrototype')
    sourceSets.main.java.srcDir 'src/provinceExplore/java'
    minecraft.runs.client {
        workingDirectory project.file('build/deep-province-explore')
        property 'forge.logging.console.level', 'info'
        property 'tidalterror.deepExplore', 'true'
        args '--width', '1600', '--height', '900'
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def audit=file('build/deep-province-test')
            if (!new File(audit,'passed.txt').exists() || !new File(audit,'passed.txt').text.contains('cold persisted edit'))
                throw new GradleException('Run deepProvinceTests and deepReload first')
            def checkpoint=new groovy.json.JsonSlurper().parse(new File(audit,'checkpoint.json'))
            def client=file('build/deep-province-explore')
            client.mkdirs()
            new File(client,'province-center.txt').text=checkpoint.x + ',' + checkpoint.z
            new File(client,'config').mkdirs()
            new File(client,'config/endless.json').text='{"buildHeight":{"minBuildHeight":-1024,"maxBuildHeight":1024}}'
            def source=new File(audit,'deep-province-world')
            def target=new File(client,'saves/Deep Reef Province Exploration v5')
            if (!target.exists()) {
                def channel=java.nio.channels.FileChannel.open(new File(source,'session.lock').toPath(),java.nio.file.StandardOpenOption.WRITE)
                try {
                    def lock=channel.tryLock()
                    if (lock==null) throw new GradleException('Deep audit world is still running')
                    try { copy { from source; into target; exclude 'session.lock' } } finally { lock.release() }
                } finally { channel.close() }
            }
        }
    }
}

