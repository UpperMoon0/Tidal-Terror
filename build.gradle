// Opt-in Forge province preset; legacy placement remains the release default.
if (project.hasProperty('provinceExplore')) {
    if (!project.hasProperty('provincePrototype')) throw new GradleException('provinceExplore requires provincePrototype')
    sourceSets.main.java.srcDir 'src/provinceExplore/java'
    minecraft.runs.client {
        workingDirectory project.file('build/province-explore')
        property 'forge.logging.console.level', 'info'
        args '--width', '1600', '--height', '900'
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def audited = file('build/province-native-test/province-test-world')
            if (!file('build/province-native-test/passed.txt').exists()) throw new GradleException('Run provinceTests first')
            def log = file('build/province-scale-audit.log').text
            def location = log =~ /PROVINCE_AUDIT center=Center\[x=(-?\d+), z=(-?\d+)\]/
            if (!location.find()) throw new GradleException('Native audit log has no accepted center')
            def client = file('build/province-explore')
            client.mkdirs()
            new File(client, 'province-center.txt').text = location.group(1) + ',' + location.group(2)
            def target = new File(client, 'saves/Reef Province Exploration v2')
            if (!target.exists()) {
                def channel = java.nio.channels.FileChannel.open(new File(audited, 'session.lock').toPath(), java.nio.file.StandardOpenOption.WRITE)
                try {
                    def lock = channel.tryLock()
                    if (lock == null) throw new GradleException('Audit world is still running')
                    try { copy { from audited; into target; exclude 'session.lock' } } finally { lock.release() }
                } finally { channel.close() }
            }
        }
    }
}
if (project.hasProperty('provincePrototype')) {
    sourceSets.main.resources.srcDir 'src/provincePrototype/resources'
    minecraft.runs.configureEach { property 'tidalterror.provincePrototype', 'true' }
    tasks.named('jar') { archiveClassifier = 'province-prototype' }
}

if (project.hasProperty('provincePrototype')) {
    tasks.named('processResources') {
        inputs.property('provincePrototype', true)
        doLast {
            def path = new File(destinationDir, 'tidalterror.mixins.json')
            def config = new groovy.json.JsonSlurper().parse(path)
            config.mixins.remove('ReefDistributionMixin')
            config.mixins.addAll(['ProvinceRandomStateMixin', 'ProvinceClimateSamplerMixin', 'ProvinceNativeHeightMixin', 'ProvinceNoiseCellAccess', 'DeepProvinceChunkMixin', 'DeepProvincePreparationMixin', 'DeepProvinceBiomeMixin', 'DeepProvinceHeightMixin'])
            path.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n'
            def oceanTag = new File(destinationDir, 'data/minecraft/tags/worldgen/biome/is_ocean.json')
            def ocean = new groovy.json.JsonSlurper().parse(oceanTag)
            if (!ocean.values.contains('tidalterror:sunken_wastes')) ocean.values.add('tidalterror:sunken_wastes')
            oceanTag.text = groovy.json.JsonOutput.toJson(ocean) + '\n'

        }
    }
}
