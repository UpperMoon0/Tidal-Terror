buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
apply plugin: 'org.spongepowered.mixin'
mixin { add sourceSets.main, 'tidalterror.refmap.json'; config 'tidalterror.mixins.json' }

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'parchment', version: '2023.06.26-1.20.1'

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'tidalterror', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// The logical-floor fog fix is owned by the unreleased Endless 0.9.3 PR.
// Build that PR and install its Forge jar here before building this prototype.
// Never silently fall back to 0.9, which lacks the migrated fix.
def endlessArtifact = file('.dependencies/endless/endless-forge-1.20.1-0.9.3.jar')
if (!endlessArtifact.exists()) throw new GradleException('Build Endless 0.9.3 and copy its Forge jar to ' + endlessArtifact)
new java.util.jar.JarFile(endlessArtifact).withCloseable { jar ->
    def entry = jar.getJarEntry('META-INF/mods.toml')
    if (entry == null) throw new GradleException('Endless dependency is not a Forge mod jar')
    def metadata = jar.getInputStream(entry).withCloseable { it.getText('UTF-8') }
    if (!(metadata =~ /version\s*=\s*["']0\.9\.3["']/).find())
        throw new GradleException('Endless dependency must contain version 0.9.3')
}

repositories {
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    flatDir { dirs '.dependencies/shaders' }
    flatDir { dirs '.dependencies/endless' }
    maven { url = 'https://maven.architectury.dev/' }
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

configurations {
    localRuntime { canBeConsumed = false; canBeResolved = false }
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation fg.deobf('dev.local:endless-forge-1.20.1:0.9.3')
    implementation fg.deobf('dev.architectury:architectury-forge:9.2.14')
    // Optional developer tooling; never published as a required dependency.
    if (!project.properties.keySet().any { it.endsWith('Tests') } && !project.hasProperty('provinceExplore') && !project.hasProperty('deepProvinceExplore')) {
        localRuntime fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (project.hasProperty('provincePrototype')) {
        compileOnly fg.deobf("com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.6")
    } else {
        implementation fg.deobf("com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.6")
    }
    if (file('.dependencies/shaders/oculus-mc1.20.1-1.8.0.jar').exists()
            && file('.dependencies/shaders/embeddium-0.3.31+mc1.20.1.jar').exists()
            && !project.hasProperty('reefTests') && !project.hasProperty('coralCrusherTests') && !project.hasProperty('cathedralRayTests') && !project.hasProperty('veilglowTests') && !project.hasProperty('shardbackTests') && !project.hasProperty('reefLifeTests') && !project.hasProperty('foodTests') && !project.hasProperty('spawnPoolTests') && !project.hasProperty('equipmentTests') && !project.hasProperty('weaponBalanceTests') && !project.hasProperty('provinceTests') && !project.hasProperty('provinceExplore') && !project.hasProperty('deepProvinceTests') && !project.hasProperty('deepProvinceExplore')) {
        runtimeOnly fg.deobf('dev.local:oculus-mc1.20.1:1.8.0')
        runtimeOnly fg.deobf('dev.local:embeddium:0.3.31+mc1.20.1')
        // ForgeGradle exposes Oculus's bundled jcpp; adding it twice breaks Java modules.
    }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            terrablender_required: !project.hasProperty('provincePrototype'),
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                // Stable across retries of the same version; no wall-clock build timestamp.
                'Implementation-Minecraft-Version': minecraft_version
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Opt-in native AI regression tests; keep fixtures out of the release jar.
if (project.hasProperty('veilglowPreview')) {
    sourceSets.main.java.srcDir 'src/veilglowPreview/java'
    minecraft.runs.client {
        workingDirectory project.file('build/veilglow-client-preview')
        property 'forge.logging.console.level', 'info'
        args '--width', '1280', '--height', '720'
    }
}
if (project.hasProperty('rayPreview')) {
    sourceSets.main.java.srcDir 'src/rayPreview/java'
    minecraft.runs.client {
        workingDirectory project.file('build/ray-client-preview')
        property 'forge.logging.console.level', 'info'
        args '--width', '1280', '--height', '720'
    }
}
if (project.hasProperty('reefPreview')) {
    sourceSets.main.java.srcDir 'src/preview/java'
    minecraft.runs.client {
        workingDirectory project.file(project.hasProperty('reefLushPreview')?'build/reef-preview-v6':'build/reef-preview-v5')
        property 'tidalterror.reefAudit', 'true'
        if(project.hasProperty('reefSharkPhotos')) property 'tidalterror.sharkPhotosOnly', 'true'
        if(project.hasProperty('crusherSkinPreview')) property 'tidalterror.sandyPhotosOnly', 'true'
        if(project.hasProperty('reefLushPreview')) property 'tidalterror.lushPreview', 'true'
        property 'forge.logging.console.level', 'info'
        args '--width', '1920', '--height', '1080'
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def preview = file(project.hasProperty('reefLushPreview')?'build/reef-preview-v6':'build/reef-preview-v5')
            def pack = file('run/shaderpacks/ComplementaryReimagined_r5.9.3.zip')
            if (!pack.exists()) throw new GradleException('Run python tools/install_dev_shaders.py first.')
            copy { from pack; into new File(preview, 'shaderpacks') }
            new File(preview, 'config').mkdirs()
            new File(preview, 'config/oculus.properties').text = 'shaderPack=ComplementaryReimagined_r5.9.3.zip\nenableShaders=true\n'
            new File(preview, 'shaderpacks/ComplementaryReimagined_r5.9.3.zip.txt').text = 'WATER_FOG_MULT=15\n'
            def world = new File(preview, 'saves/Coral Cathedral Preview')
            if (!world.exists()) {
                def audited = file('build/reef-native-test-v4a/reef-audit-world')
                if (!audited.exists()) throw new GradleException('Run the isolated reefTests server audit first.')
                copy { from audited; into world }
            }
        }
        doLast {
            def captureFolder=project.hasProperty('reefLushPreview')?'art/coral-cathedral-v4':project.hasProperty('crusherSkinPreview')?'art/coral-crusher-sandy-v1':'art/coral-cathedral-v3'
            def captures=file(captureFolder+'/capture-manifest.json')
            if(!captures.exists() || file(captureFolder+'/failure.txt').exists())
                throw new GradleException('Shader preview validation failed; inspect the capture log.')
            def expected=project.hasProperty('reefLushPreview')?13:project.hasProperty('crusherSkinPreview')?3:12
            if(new groovy.json.JsonSlurper().parse(captures).size()!=expected)
                throw new GradleException('Incomplete validated shader captures.')
        }
    }
}

if (project.hasProperty('reefTests')) {
    sourceSets.main.java.srcDir 'src/reefTest/java'
    minecraft.runs.server {
        workingDirectory project.file('build/reef-native-test-v4a')
        property 'tidalterror.reefAudit', 'true'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runServer' }.configureEach {
        doFirst { delete file('build/reef-audit-v4/passed.txt') }
        doLast {
            if (!file('build/reef-audit-v4/passed.txt').exists()) throw new GradleException('Native reef audit failed; inspect the server audit log.')
        }
    }
}

if (project.hasProperty('cathedralRayTests')) {
    sourceSets.main.java.srcDir 'src/rayTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/cathedral-ray-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def rayLog = file('build/cathedral-ray-gametest/logs/latest.log')
            if (!rayLog.exists() || !rayLog.text.contains('12 GAME TESTS COMPLETE')
                    || !rayLog.text.contains('All 12 required tests passed')) {
                throw new GradleException('Ray GameTests did not complete; inspect the native server log.')
            }
        }
    }
}

if (project.hasProperty('veilglowTests')) {
    sourceSets.main.java.srcDir 'src/veilglowTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/veilglow-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def log = file('build/veilglow-gametest/logs/latest.log')
            if (!log.exists() || !log.text.contains('3 GAME TESTS COMPLETE') || !log.text.contains('All 3 required tests passed'))
                throw new GradleException('Veilglow GameTests did not pass; inspect the native log.')
        }
    }
}

if (project.hasProperty('coralCrusherTests')) {
    sourceSets.main.java.srcDir 'src/gameTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/coral-crusher-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def log = file('build/coral-crusher-gametest/logs/latest.log')
            if (!log.exists() || !log.text.contains('29 GAME TESTS COMPLETE')
                    || !log.text.contains('All 29 required tests passed'))
                throw new GradleException('Coral Crusher tests did not all pass; inspect the native server log.')
        }
    }
}

if (project.hasProperty('coralCrusherModelTests')) {
    sourceSets {
        modelTest {
            java.srcDir 'src/modelTest/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
        }
    }
    tasks.register('verifyCoralCrusherAnimation', JavaExec) {
        dependsOn tasks.named('modelTestClasses')
        classpath = sourceSets.modelTest.runtimeClasspath
        mainClass = 'com.nhat.tidal_terror.entities.coral_crusher.CoralCrusherAnimationCheck'
    }
    tasks.register('verifyCathedralRayModel', JavaExec) {
        dependsOn tasks.named('modelTestClasses')
        classpath = sourceSets.modelTest.runtimeClasspath
        mainClass = 'com.nhat.tidal_terror.entities.cathedral_ray.CathedralRayModelCheck'
    }
    tasks.register('verifyVeilglowModel', JavaExec) {
        dependsOn tasks.named('modelTestClasses')
        classpath = sourceSets.modelTest.runtimeClasspath
        mainClass = 'com.nhat.tidal_terror.entities.veilglow.VeilglowModelCheck'
    }
    tasks.register('verifyShardbackModel', JavaExec) {
        dependsOn tasks.named('modelTestClasses')
        classpath = sourceSets.modelTest.runtimeClasspath
        mainClass = 'com.nhat.tidal_terror.entities.shardback.ShardbackModelCheck'
    }
    tasks.register('verifyReefEquipmentModel', JavaExec) {
        dependsOn tasks.named('modelTestClasses')
        classpath = sourceSets.modelTest.runtimeClasspath
        mainClass = 'com.nhat.tidal_terror.client.EquipmentModelCheck'
    }
}

if (project.hasProperty('equipmentTests')) {
    sourceSets.main.java.srcDir 'src/equipmentTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/equipment-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def log=file('build/equipment-gametest/logs/latest.log')
            if (!log.exists() || !log.text.contains('18 GAME TESTS COMPLETE') || !log.text.contains('All 18 required tests passed'))
                throw new GradleException('Reef equipment native tests did not pass; inspect the native server log.')
        }
    }
}

if (project.hasProperty('equipmentPreview')) {
    sourceSets.main.java.srcDir 'src/equipmentPreview/java'
    minecraft.runs.client {
        workingDirectory project.file('build/equipment-client-preview')
        property 'forge.logging.console.level', 'info'
        args '--width', '1280', '--height', '720'
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        doLast {
            def passed=file(project.findProperty('equipmentEvidence') ?: 'art/reef-equipment/runtime/passed.txt')
            if (!passed.exists()) throw new GradleException('Reef equipment framebuffer preview did not complete.')
        }
    }
}

if (project.hasProperty('shardbackTests')) {
    sourceSets.main.java.srcDir 'src/shardbackTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/shardback-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def log = file('build/shardback-gametest/logs/latest.log').text
            if (!log.contains('2 GAME TESTS COMPLETE') || !log.contains('All 2 required tests passed'))
                throw new GradleException('Shardback native tests did not pass')
        }
    }
}

if (project.hasProperty('shardbackPreview')) {
    sourceSets.main.java.srcDir 'src/shardbackPreview/java'
    minecraft.runs.client {
        workingDirectory project.file('build/shardback-client-preview')
        property 'forge.logging.console.level', 'info'
    }
}

if (project.hasProperty('foodTests')) {
    sourceSets.main.java.srcDir 'src/foodTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/food-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def log = file('build/food-gametest/logs/latest.log')
            if (!log.exists() || !log.text.contains('3 GAME TESTS COMPLETE') || !log.text.contains('All 3 required tests passed'))
                throw new GradleException('Reef food native tests did not pass')
        }
    }
}

if (project.hasProperty('reefLifeTests')) {
    sourceSets.main.java.srcDirs 'src/veilglowTest/java', 'src/shardbackTest/java', 'src/reefLifeTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/reef-life-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def log=file('build/reef-life-gametest/logs/latest.log')
            if (!log.exists() || !log.text.contains('15 GAME TESTS COMPLETE') || !log.text.contains('All 15 required tests passed'))
                throw new GradleException('Reef life native tests did not pass')
        }
    }
}

if (project.hasProperty('spawnPoolTests')) {
    sourceSets.main.java.srcDir 'src/spawnPoolTest/java'
    sourceSets.main.java.srcDir 'src/spawnTargetTest/java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/spawn-pool-gametest')
        property 'forge.enabledGameTestNamespaces', 'tidalterror'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doLast {
            def log=file('build/spawn-pool-gametest/logs/latest.log')
            if (!log.exists() || !log.text.contains('4 GAME TESTS COMPLETE') || !log.text.contains('All 4 required tests passed'))
                throw new GradleException('Reef spawn pool tests did not pass; inspect the native server log.')
        }
    }
}

