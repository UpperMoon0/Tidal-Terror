if (project.hasProperty('deepProvinceTests')) {
    if (!project.hasProperty('provincePrototype')) throw new GradleException('deepProvinceTests requires provincePrototype')
    def deepTestDirectory=project.file(project.findProperty('deepProvinceTestDirectory') ?: 'build/deep-province-test')
    sourceSets.main.java.srcDir 'src/deepProvinceTest/java'
    minecraft.runs.server {
        workingDirectory deepTestDirectory
        property 'forge.logging.console.level', 'info'
        property 'tidalterror.deepReload', project.hasProperty('deepReload') ? 'true' : 'false'
        args '--nogui'
    }
    tasks.matching { it.name == 'runServer' }.configureEach {
        doFirst {
            def directory=deepTestDirectory.canonicalFile
            def world=new File(directory,'deep-province-world').canonicalFile
            if (!world.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())) throw new GradleException('Unsafe deep test world')
            directory.mkdirs()
            if (!project.hasProperty('deepReload')) { project.delete(world); project.delete(new File(directory,'checkpoint.json')) }
            project.delete(new File(directory,'passed.txt')); project.delete(new File(directory,'failure.txt'))
            new File(directory,'config').mkdirs()
            new File(directory,'config/endless.json').text='{"buildHeight":{"minBuildHeight":-1024,"maxBuildHeight":1024}}'
            new File(directory,'eula.txt').text='eula=true\n'
            new File(directory,'server.properties').text='level-name=deep-province-world\nlevel-seed=0\nlevel-type=tidalterror:reef_province_deep\nonline-mode=false\nmax-tick-time=0\nview-distance=2\nsimulation-distance=2\ngenerate-structures=false\nserver-port=25581\nserver-ip=127.0.0.1\n'
        }
        doLast { if (!new File(deepTestDirectory,'passed.txt').exists()) throw new GradleException('Deep province native audit failed') }
    }
