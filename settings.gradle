pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://libraries.minecraft.net/'; content { includeGroup 'com.mojang' } }
        maven {
            url = 'https://maven.fabricmc.net/'
            content { includeGroupByRegex 'net\\.fabricmc.*' }
        }
        maven {
            url = 'https://maven.architectury.dev/'
            content { includeGroupByRegex 'dev\\.architectury.*'; includeGroupByRegex 'architectury-plugin.*' }
        }
        maven {
            url = 'https://maven.neoforged.net/releases'
            content { includeGroupByRegex 'net\\.neoforged.*' }
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
            content { includeGroupByRegex 'net\\.minecraftforge.*'; includeGroupByRegex 'de\\.oceanlabs.*'; includeGroupByRegex 'com\\.github\\.glitchfiend.*' }
        }
        maven {
            url = 'https://maven.parchmentmc.org'
            content { includeGroupByRegex 'org\\.parchmentmc.*' }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}
rootProject.name = 'tidalterror'
if (gradle.startParameter.projectProperties.containsKey('multiversion')) {
    rootProject.buildFileName = 'build.multiversion.gradle'
    def targets = ['fabric-1.20.1','fabric-1.21.1','neoforge-1.21.1','neoforge-26.1.2']
    def selected = gradle.startParameter.taskNames.findAll { it.startsWith(':') }.collect { it.split(':')[1] }.findAll { it in targets }
    if (selected.isEmpty()) selected = targets
    include 'common'
    selected.each { target ->
        if (target.endsWith('1.20.1')) include 'common-1.20.1'
        if (target.endsWith('1.21.1')) include 'common-1.21.1'
        include target
    }
}
