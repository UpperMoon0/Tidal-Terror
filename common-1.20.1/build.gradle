architectury { common 'fabric' }
loom { mixin { defaultRefmapName = 'tidalterror-1.20.1-refmap.json' } }
dependencies {
    implementation project(':common')
    modImplementation "net.fabricmc:fabric-loader:${project.loader}"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabricApi}"
    modCompileOnly 'com.jamieswhiteshirt:reach-entity-attributes:2.4.0'
    modImplementation "dev.architectury:architectury:${project.api}"
    modImplementation 'com.github.glitchfiend:TerraBlender-fabric:1.20.1-3.0.1.6'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}
sourceSets.main.resources { srcDir rootProject.file('src/main/resources'); srcDir rootProject.file('src/generated/resources'); exclude 'META-INF/mods.toml'; exclude 'tidalterror.mixins.json' }

sourceSets.main.java.srcDir rootProject.file('common-versioned/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common-1201-1211/src/main/java')

jar { from project(':common').sourceSets.main.output; duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

processResources {
    inputs.property 'reefCategoryNames', 'namespaced-v1'
    filesMatching('data/tidalterror/worldgen/biome/coral_cathedral.json') {
        filter { line -> line.replace('"tidalterror_crusher"','"tidalterror:crusher"').replace('"tidalterror_ray"','"tidalterror:ray"').replace('"tidalterror_veilglow"','"tidalterror:veilglow"').replace('"tidalterror_shardback"','"tidalterror:shardback"') }
    }
}

sourceSets.main.java.srcDir rootProject.file('common-universal/src/main/java')

sourceSets.main.java.srcDir rootProject.file('common-ports/src/main/java')
